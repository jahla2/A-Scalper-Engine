[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "a-scalper-engine"
version = "0.2.0"
description = "Deterministic multi-timeframe A+ scalping engine for PrimeXBT MCP"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=2.0,<3.0",
  "httpx2>=2.11,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
aplus = "scalper.runner:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
